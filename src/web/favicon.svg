<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="hwb favicon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1d22"/>
      <stop offset="1" stop-color="#141518"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5b8d6"/>
      <stop offset="1" stop-color="#8fa5c9"/>
    </linearGradient>
  </defs>

  <!-- rounded-square tile on the dark-navy workbench palette -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- thin accent glint along the top edge, echoing the topbar/brand accent -->
  <path d="M14 7.5 h36 a6.5 6.5 0 0 1 6.5 6.5 v1.2 h-49 v-1.2 a6.5 6.5 0 0 1 6.5-6.5 z" fill="#8fa5c9" opacity="0.55"/>

  <!-- low-opacity accent halo behind the mark for depth -->
  <circle cx="32" cy="34" r="20" fill="#8fa5c9" opacity="0.08"/>

  <!-- "hωb" wordmark (brand (=hωb=)) — h/b in light ink, ω in the DeepSeek accent.
       位置关系参照 (=hωb=)：h 与 b 同基线等高、略收拢但间距稍放宽；ω 更小，沉到两者下缘之间，
       顶部贴近 h/b 下沿、底面下垂略低于基线，形成"ω 嵌在 h b 下方"的嵌套关系。 -->
  <text x="19" y="41" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="23" font-weight="800">
    <tspan fill="#d8d5cf">h</tspan>
  </text>
  <text x="32" y="49" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="18" font-weight="800">
    <tspan fill="url(#accent)">ω</tspan>
  </text>
  <text x="45" y="41" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="23" font-weight="800">
    <tspan fill="#d8d5cf">b</tspan>
  </text>
</svg>
