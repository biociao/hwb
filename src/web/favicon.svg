<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="hwb favicon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2336"/>
      <stop offset="1" stop-color="#0e1018"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d87ff"/>
      <stop offset="1" stop-color="#4d6bfe"/>
    </linearGradient>
  </defs>

  <!-- rounded-square tile on the dark-navy workbench palette -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- thin accent glint along the top edge, echoing the topbar/brand accent -->
  <path d="M14 7.5 h36 a6.5 6.5 0 0 1 6.5 6.5 v1.2 h-49 v-1.2 a6.5 6.5 0 0 1 6.5-6.5 z" fill="#4d6bfe" opacity="0.55"/>

  <!-- low-opacity accent halo behind the mark for depth -->
  <circle cx="32" cy="34" r="20" fill="#4d6bfe" opacity="0.08"/>

  <!-- "hωb" wordmark (brand (=hωb=)) — h/b in light ink, ω in the DeepSeek accent.
       h 与 b 靠得更近（收拢到 ω 两侧）；ω 下沉半个字符位置。 -->
  <text x="20" y="42" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="27" font-weight="800">
    <tspan fill="#e8ecf8">h</tspan>
  </text>
  <text x="32" y="51" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="27" font-weight="800">
    <tspan fill="url(#accent)">ω</tspan>
  </text>
  <text x="44" y="42" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="27" font-weight="800">
    <tspan fill="#e8ecf8">b</tspan>
  </text>
</svg>
