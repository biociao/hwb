<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hwb — harness workbench</title>
  <!-- 网页标题图标：优先 SVG（现代浏览器清晰/可缩放），PNG/ICO 作回退，另配 apple-touch -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      /* 浅色主题（默认）：暖纸白画布 + 墨色文字 + 细灰边框 + 墨蓝 accent */
      --bg: #f7f6f3; --panel: #fdfdfc; --panel-2: #f0efeb; --border: #e3e1db;
      --fg: #1f2328; --dim: #6f6a61; --accent: #3e5c94; --accent-2: #33497a;
      --accent-soft: rgba(62, 92, 148, .09); --accent-line: rgba(62, 92, 148, .38);
      --on-accent: #ffffff; --hover: #eeece7;
      --ok: #3f7d5d; --warn: #a37b2a; --bad: #a8463f;
      --workbench-columns: minmax(230px, 23fr) minmax(0, 55fr) minmax(210px, 22fr);
      /* 浅色专属 surface / 文本 token（深色主题各自覆盖） */
      --sunken: #efede8; --tooltip-bg: #fdfdfc; --scroll: #cfcbc2; --code-fg: #3a3f47;
      --proj-bg: #f3ecdd; --proj-fg: #7d6420; --overlay: rgba(28,26,22,.38);
      /* Projects 来源标签：按「数据来源 app」（实例 harness）区分 ——
         dsh 蓝 / Codex 灰 / Claude Code 橙 / WorkBuddy 绿 / 未识别 紫。
         浅色主题 = 极浅底 + 同色细描边；深色主题各自换一套。 */
      --src-dsh: #e8eef8; --src-dsh-line: #d3dded;
      --src-codex: #ececea; --src-codex-line: #dbdbd6;
      --src-claude: #f8ecdf; --src-claude-line: #ecd8c3;
      --src-workbuddy: #e7f1e7; --src-workbuddy-line: #d2e3d1;
      --src-other: #efeaf4; --src-other-line: #ded4e8;
      --log-scope: #3d7a6e; --log-warn-msg: #8f6d24; --log-error-msg: #96423a;
      --dot-ring: #fdfdfc; --seg-out: #5d8a72; --seg-hit: #5a8a94; --seg-write: #b08a3e;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    }
    /* 深色主题：手动选择「黑夜」时生效 */
    :root[data-theme="dark"] {
      --bg: #141518; --panel: #1b1d22; --panel-2: #22252c; --border: #2c2f37;
      --fg: #d8d5cf; --dim: #8b887f; --accent: #8fa5c9; --accent-2: #a5b8d6;
      --accent-soft: rgba(143, 165, 201, .13); --accent-line: rgba(143, 165, 201, .45);
      --on-accent: #14171f; --hover: #262930;
      --ok: #6fae8f; --warn: #c9a35c; --bad: #c97b72;
      --sunken: #1e2026; --tooltip-bg: #22252c; --scroll: #3a3e48; --code-fg: #b3b0a8;
      --proj-bg: #34301f; --proj-fg: #c9b06a; --overlay: rgba(5,6,8,.62);
      --src-dsh: #1f2734; --src-dsh-line: #2d394b;
      --src-codex: #26272a; --src-codex-line: #35363a;
      --src-claude: #2c241b; --src-claude-line: #3d3123;
      --src-workbuddy: #1f2a20; --src-workbuddy-line: #2c3a2e;
      --src-other: #262230; --src-other-line: #372f45;
      --log-scope: #7fae9f; --log-warn-msg: #c9b184; --log-error-msg: #d3988f;
      --dot-ring: #1b1d22; --seg-out: #6f9a82; --seg-hit: #6f9aa4; --seg-write: #bfa05c;
    }
    /* 深色主题（跟随系统）：未显式选「白天」时，系统切暗就跟随 */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #141518; --panel: #1b1d22; --panel-2: #22252c; --border: #2c2f37;
        --fg: #d8d5cf; --dim: #8b887f; --accent: #8fa5c9; --accent-2: #a5b8d6;
        --accent-soft: rgba(143, 165, 201, .13); --accent-line: rgba(143, 165, 201, .45);
        --on-accent: #14171f; --hover: #262930;
        --ok: #6fae8f; --warn: #c9a35c; --bad: #c97b72;
        --sunken: #1e2026; --tooltip-bg: #22252c; --scroll: #3a3e48; --code-fg: #b3b0a8;
        --proj-bg: #34301f; --proj-fg: #c9b06a; --overlay: rgba(5,6,8,.62);
        --src-dsh: #1f2734; --src-dsh-line: #2d394b;
        --src-codex: #26272a; --src-codex-line: #35363a;
        --src-claude: #2c241b; --src-claude-line: #3d3123;
        --src-workbuddy: #1f2a20; --src-workbuddy-line: #2c3a2e;
        --src-other: #262230; --src-other-line: #372f45;
        --log-scope: #7fae9f; --log-warn-msg: #c9b184; --log-error-msg: #d3988f;
        --dot-ring: #1b1d22; --seg-out: #6f9a82; --seg-hit: #6f9aa4; --seg-write: #bfa05c;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); display: flex; flex-direction: column;
           min-height: 100vh; font: 14px/1.55 var(--font-sans); }

    /* 顶部 bar：品牌 + 实例 tab 卡（可拖动排序） */
    #topbar { display: grid; grid-template-columns: var(--workbench-columns); align-items: center; gap: 20px; padding: 12px 20px; min-height: 64px;
              border-bottom: 1px solid var(--border); background: var(--panel);
              flex-shrink: 0; position: sticky; top: 0; z-index: 10; }
    .topbar-start { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .topbar-right { display: flex; justify-content: flex-end; grid-column: 3; }
    #topbar .brand { font-size: 17px; font-weight: 700; display: flex; gap: 10px; align-items: baseline;
                     flex-shrink: 0; font-family: var(--font-sans); letter-spacing: -.02em; }
    #topbar .brand .live { font-size: 12px; font-weight: 400; color: var(--dim);
                           font-family: var(--font-sans); }
    #topbar .brand .live.on { color: var(--ok); }
    /* 选项卡：独立「胶囊」造型，选中态用墨蓝淡底 + 细描边标识 */
    .tabbar { display: flex; align-items: center; gap: 6px; overflow-x: auto; min-width: 0; flex: 1; }
    .tab { display: flex; align-items: center; gap: 8px; padding: 6px 12px; height: auto;
           border: 1px solid transparent; border-radius: 6px; background: transparent;
           color: var(--dim); font: inherit; font-size: 13px; line-height: 1;
           cursor: pointer; white-space: nowrap; flex-shrink: 0;
           transition: color .16s, background .16s, border-color .16s, box-shadow .16s; }
    .tab:hover { color: var(--fg); background: var(--hover); border-color: var(--border); }
    .tab.active { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-line); }
    .tab-popout { margin-left: -4px; padding: 6px; color: var(--accent); }
    .tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex-shrink: 0; }
    .tab .dot.running { background: var(--ok); box-shadow: 0 0 0 2px var(--accent-soft); }
    .tab .dot.unreachable { background: var(--warn); }
    .tab .dot.gone { background: var(--bad); }
    .tab .label { overflow: hidden; text-overflow: ellipsis; }
    .tab[draggable=true] { cursor: grab; }
    .tab.dragging { opacity: .4; }
    .tab.drag-target { box-shadow: 0 0 0 2px var(--accent); }

    #main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column;
            overflow: hidden; }
    /* 视图面板：工作台 / 每个实例一个持久 iframe。切换只 show/hide，不销毁重建。 */
    .view { flex: 1; min-height: 0; }
    .view[hidden] { display: none !important; }
    #dashboard[data-layout=grid] { display: grid; grid-template-columns: var(--workbench-columns); gap: 20px;
                                   padding: 20px; align-content: start; align-items: start; overflow-y: auto; }
    #dashboard[data-layout=onboarding] { padding: 24px 28px; overflow-y: auto; }

    section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    section > h2 { margin: 0; padding: 10px 14px; font-size: 12px; color: var(--dim);
                   border-bottom: 1px solid var(--border); text-transform: uppercase;
                   letter-spacing: .02em; font-family: var(--font-sans); font-weight: 600; }
    .rows { padding: 6px; }
    /* 三栏等高，筛选固定在列表上方；内容滚动不改变卡片高度。 */
    #dashboard[data-layout=grid] > .pane { display: flex; flex-direction: column; min-height: 0; height: calc(100dvh - 104px); }
    .pane > .rows, .session-list { overflow-y: auto; flex: 1; min-height: 0; }
    .session-list > .rows { overflow: visible; }
    #dashboard[data-layout=grid] :is(.rows, .session-list)::-webkit-scrollbar { width: 6px; }
    #dashboard[data-layout=grid] :is(.rows, .session-list)::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 4px; }
    .row { padding: 8px 10px; border-radius: 6px; }
    .row:hover { background: var(--hover); }
    .row.clickable { cursor: pointer; }

    /* —— 分区身份：Projects（项目色/赭石）· Sessions（强调色/墨蓝）· Instances（中性）——
       分区色 + 图标 + 计数是第一层线索；卡片形状差异是第二层（见下）。 */
    section.pane > h2 { display: flex; align-items: center; gap: 8px; }
    .pane-title { display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
    .pane-mark { font-size: 12px; line-height: 1; opacity: .9; }
    section.pane-projects, section.pane-instances { background: transparent; border-color: transparent; }
    section.pane > h2 { padding: 12px; font-size: 14px; color: var(--fg); background: transparent; text-transform: none; letter-spacing: 0; flex-shrink: 0; }
    section.pane-sessions { border-color: var(--border); }
    section.pane-sessions > h2 { padding: 16px 18px 8px; font-size: 20px; border-bottom: 0; }
    section.pane-instances { border-top: 2px solid var(--border); }
    .pane-count { margin-left: auto; padding: 1px 7px; border-radius: 9px; font-size: 10px;
      color: inherit; background: color-mix(in srgb, currentColor 13%, transparent);
      font-variant-numeric: tabular-nums; letter-spacing: 0; }
    /* 项目范围切换（最近 / 全部）：分区头里的分段控件（见 workbench.js 的 projectsScopeHtml）。
       它必须常驻在表头 —— 列表被 7 天窗口/limit 截断时，用户要靠它发现「还有全部项目」；
       放进列表会随列表滚走，翻到第 300 个项目时反而找不到。 */
    .pane-scope { display: inline-flex; flex: none; gap: 3px; margin-left: 4px; }
    .pane-scope-btn { padding: 1px 7px; font-size: 10.5px; line-height: 16px; border-radius: 9px;
      border: 1px solid var(--border); background: transparent; color: var(--dim);
      cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
    .pane-scope-btn:hover { border-color: var(--accent); color: var(--fg); }
    .pane-scope-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent);
      color: var(--on-accent); font-weight: 600; }
    /* 列表底部的范围说明（「仅显示前 N 个」）：与 muted-note 一样挂在 .rows 之外，
       列表滚动时它不滚走，所以用户翻到底一定看得到「这不是全部」。 */
    .pane-note { padding: 8px 10px; border-top: 1px dashed var(--border); color: var(--dim); font-size: 11.5px; }
    .pane-note button { margin-left: 6px; padding: 0 8px; font-size: 11px; }
    section > h2 button.add { margin-left: auto; float: none; }
    /* 项目筛选条：Recent Sessions 分区头与列表之间的一条状态带（见 recent-sessions.js
       的 renderSessionFilter）。它不在 .rows 滚动区里，筛选中时始终可见。
       布局：标签 + 项目名（可截断，完整值在 title）+ ✕ + 条数 + 打开项目。 */
    .pane-filter { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 7px 10px;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--accent-soft) 55%, var(--panel));
      font-size: 12px; color: var(--dim); }
    .pane-filter .filter-label { flex: none; }
    .pane-filter .filter-project { min-width: 0; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; font-weight: 650; color: var(--fg); }
    .pane-filter .filter-clear { flex: none; padding: 0 6px; font-size: 11px; line-height: 18px; }
    .pane-filter .filter-count { flex: none; margin-left: auto; font-size: 11px;
      font-variant-numeric: tabular-nums; white-space: nowrap; }
    .pane-filter .filter-mute { flex: none; font-size: 11px; padding: 1px 8px; }
    .pane-filter .filter-open { flex: none; font-size: 11px; padding: 1px 8px; }
    /* 默认静音项目的标记（项目卡）与说明条（Sessions 列表底部）。 */
    .chip.muted-chip { color: var(--dim); background: transparent; border: 1px dashed var(--border); }
    /* 项目卡上的隐藏开关：未静音时只在 hover / 键盘聚焦时出现（不占常驻视觉噪音），
       已静音时是常驻的「已隐藏」按钮（点一下恢复显示）。两个都是原生 button，委托 click 处理。 */
    button.chip { cursor: pointer; }
    button.chip.muted-chip { padding: 1px 8px; border-radius: 10px; font-size: 11px; font-style: normal; }
    button.chip.card-mute { padding: 1px 8px; border-radius: 10px; font-size: 11px; font-style: normal;
      color: var(--dim); background: transparent; border: 1px dashed var(--border);
      opacity: 0; transition: opacity .12s; }
    .row.project-card:hover button.chip.card-mute,
    .row.project-card:focus-within button.chip.card-mute { opacity: 1; }
    .pane-filter .filter-state { flex: none; font-size: 10px; color: var(--dim);
      border: 1px dashed var(--border); border-radius: 9px; padding: 0 6px; white-space: nowrap; }
    .muted-note { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 8px 10px; border-top: 1px dashed var(--border); color: var(--dim); font-size: 11.5px; }
    .muted-note.muted-idle { border-top-style: dotted; opacity: .9; }
    .muted-note b { color: var(--fg); font-variant-numeric: tabular-nums; }
    .muted-note button { padding: 0 8px; font-size: 11px; }

    /* —— 两种卡的第一视觉锚点不同：项目 = 身份徽标（左），会话 = 状态竖轨（左）——
       这样即使两栏并排、行高相近，扫视时也不会把「项目」看成「会话」。 */
    .row.card { display: flex; align-items: stretch; gap: 10px; padding: 9px 10px 9px 8px;
      border: 1px solid transparent; transition: background .12s, border-color .12s; }
    .row.card + .row.card { margin-top: 2px; }
    .row.card:hover { background: var(--hover); border-color: var(--border); }
    .row.card:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .card-rail { flex: 0 0 3px; border-radius: 2px; background: var(--card-accent, var(--border));
      opacity: .82; }
    .card-body { flex: 1; min-width: 0; }
    .row.card .t { align-items: center; }
    .row.card .name { flex: 1; min-width: 0; }
    .card-time { flex: none; color: var(--dim); font-size: 11px; white-space: nowrap;
      font-variant-numeric: tabular-nums; }

    /* 项目卡：徽标 + 聚合统计（会话数 / token）。项目名是粗体、单行；数字右对齐成「仪表页」。 */
    .project-card { --card-accent: var(--proj-fg); --card-tint: var(--proj-bg); }
    /* 项目卡的小标签按数据来源 app（实例 harness）区分，徽标仍是项目身份色：
         dsh 蓝 · Codex 灰 · Claude Code 橙 · WorkBuddy 绿 · 未识别 紫。
       --card-bg/--card-line 只用于来源标签，卡片默认保持中性。
       新增来源 = store.js 的 SOURCE_KINDS 加一行 + 这里加一条规则。 */
    .project-card[data-source="dsh"] { --card-bg: var(--src-dsh); --card-line: var(--src-dsh-line); }
    .project-card[data-source="codex"] { --card-bg: var(--src-codex); --card-line: var(--src-codex-line); }
    .project-card[data-source="claude-code"] { --card-bg: var(--src-claude); --card-line: var(--src-claude-line); }
    .project-card[data-source="workbuddy"] { --card-bg: var(--src-workbuddy); --card-line: var(--src-workbuddy-line); }
    .project-card[data-source="other"] { --card-bg: var(--src-other); --card-line: var(--src-other-line); }
    .project-badge { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 8px;
      display: inline-flex; align-items: center; justify-content: center; font-size: 11px;
      font-weight: 700; letter-spacing: .01em; text-transform: uppercase;
      background: var(--card-tint); color: var(--card-accent);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--card-accent) 22%, transparent); }
    .row.project-card .name { font-size: 14px; font-weight: 650; letter-spacing: -.01em; }
    .project-meta { align-items: center; margin-top: 3px; }
    .project-stat { color: var(--dim); font-size: 11px; white-space: nowrap; }
    .project-stat b { color: var(--fg); font-weight: 600; font-size: 12px;
      font-variant-numeric: tabular-nums; }
    .project-tokens { margin-left: auto; display: inline-flex; gap: 8px; color: var(--dim);
      font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }

    /* —— Projects 列：每个项目一个独立 box（用户确认的方案 A）——
       只作用于 Projects 栏；Sessions 保持连续列表 + 状态轨，两栏形态继续分化。
       默认无大面积来源底色，以悬停和选中态表达导航位置。 */
    .pane-projects .rows { padding: 6px 0; display: flex; flex-direction: column; gap: 4px; }
    .pane-projects .rows > .row.card { position: relative; overflow: hidden;
      /* 列表是「固定高度 + 滚动」的 flex 列：卡片必须不收缩，否则会被压扁（实测压到 22px），
         滚动交给容器。 */
      flex: 0 0 auto;
      padding: 10px 12px 10px 15px;
      border-color: transparent; border-radius: 8px;
      background: transparent; box-shadow: none;
      transition: background .12s, border-color .12s; }
    /* 盒子之间由 gap 控制，不能叠加 .row.card + .row.card 的 margin-top */
    .pane-projects .rows > .row.card + .row.card { margin-top: 0; }
    /* 悬停与选中分别表达临时交互和当前项目。 */
    .pane-projects .rows > .row.card:hover {
      background: var(--hover); border-color: var(--border); }
    /* 竖轨贴住盒子左边缘：DOM 里那个 .card-rail 从内容流改为绝对定位（不新增元素） */
    .pane-projects .rows > .row.card > .card-rail { position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px; border-radius: 8px 0 0 8px; opacity: 0; }
    /* 悬停联动高亮（项目↔会话）时保持可见：别被盒子的 hover 底色吃掉 */
    .pane-projects .rows > .row.card.hl-project { background: var(--accent-soft);
      border-color: var(--accent-line);
      box-shadow: none;
      transform: none; }
    /* 选中（正在筛选）的项目卡：常驻强调色描边 + 左侧竖轨变实，
       与 hover 的临时高亮区分开 —— 用户要能一眼看出「Sessions 栏是按哪个项目筛的」。 */
    .pane-projects .rows > .row.card.selected { border-color: var(--accent-line);
      background: var(--accent-soft); box-shadow: none; }
    .pane-projects .rows > .row.card.selected > .card-rail {
      background: var(--accent); opacity: 1; }

    /* 会话卡：左侧竖轨随状态变色；标题常规字重（运行中加粗），id 缩到尾部 6 位。 */
    .pane-sessions .rows { padding: 8px 12px; }
    .row.session-card { padding: 14px 12px 14px 0; border-color: var(--border); border-radius: 8px; background: var(--panel); }
    .row.session-card + .row.session-card { margin-top: 9px; }
    .session-card > .card-rail { flex-basis: 4px; opacity: 1; border-radius: 4px; }
    .row.session-card .t { align-items: flex-start; gap: 16px; }
    .row.session-card .name { font-size: 14px; font-weight: 500; white-space: normal; overflow-wrap: anywhere;
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; line-height: 1.6; }
    .session-card[data-status="running"] { background: color-mix(in srgb, var(--ok) 7%, var(--panel)); border-color: color-mix(in srgb, var(--ok) 35%, var(--border)); }
    .session-card[data-status="running"] .name { font-weight: 650; }
    .session-card[data-status="running"] .card-rail { background: var(--ok); }
    .session-card[data-status="completed"] .card-rail { background: var(--accent); }
    .session-card[data-status="idle"] .card-rail, .session-card[data-status="unknown"] .card-rail { background: transparent; }
    .session-card .meta { align-items: center; margin-top: 8px; padding-right: 4px; }
    /* 会话卡里的实例 chip 降级为「描边弱提示」：项目色 chip 才是这一行要读的身份信息，
       与项目卡「实例是彩色 chip」形成又一处形态差异。 */
    .session-card .chip.home-chip { background: transparent; border: 1px solid var(--border);
      color: var(--dim); padding: 0 7px; }
    .sid { margin-left: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10.5px; color: var(--dim); opacity: .85; white-space: nowrap; }
    .context-usage { display: flex; align-items: center; gap: 8px; margin-top: 9px; color: var(--dim); font-size: 11px; }
    .context-usage .pressure { width: 100px; max-width: 35%; height: 3px; margin: 0; }
    .context-usage .pressure > i { background: var(--dim); }
    .context-usage.warn { color: var(--warn); } .context-usage.bad { color: var(--bad); }
    .session-secondary { color: var(--dim); font-size: 11px; }
    .session-status-filter { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 16px 12px; border-bottom: 1px solid var(--border); }
    .session-status-filter button { display: inline-flex; gap: 6px; padding: 5px 9px; font-size: 12px; background: transparent; }
    .session-status-filter button span { font-variant-numeric: tabular-nums; opacity: .8; }
    .session-status-filter button[aria-pressed="true"] { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
    .session-order { margin-left: auto; color: var(--dim); font-size: 11px; }
    .project-card .chip.home-chip { background: var(--card-bg); border: 1px solid var(--card-line); color: var(--dim); }
    .pane-projects .project-tokens { flex-basis: 100%; margin-left: 0; }
    .pane-projects .project-meta { gap: 5px 10px; }
    .pane-projects .project-badge { width: 26px; height: 26px; font-size: 10px; }
    .pane-projects .card-time { display: none; }
    .pane-instances > .rows { padding: 0 6px; }
    .pane-instances > .rows > .row { padding: 14px 6px; border-bottom: 1px solid var(--border); border-radius: 0; }
    .pane-instances .row .t { flex-wrap: wrap; gap: 6px; }
    .pane-instances .row .t .chips { flex-wrap: wrap; gap: 4px; }
    .pane-instances .row .meta { gap: 4px 10px; font-size: 11px; margin-top: 6px; }
    .instance-details { margin-top: 8px; font-size: 11px; color: var(--dim); }
    .instance-details summary { cursor: pointer; width: fit-content; }
    .instance-details .meta { padding: 4px 0; overflow-wrap: anywhere; }

    /* 联动高亮：悬停 Projects ↔ Sessions 相互高亮 */
    .row.hl-project { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
    .chip.home-chip { background: var(--accent-soft); color: var(--accent); }
    .chip.proj-chip { background: var(--proj-bg); color: var(--proj-fg); }
    .row .t { display: flex; justify-content: space-between; gap: 8px; }
    /* 实例卡右上角的 chip 组：版本号 + 连接状态 + 降级提示。收进一个 flex 容器，
       否则 .t 的 space-between 会把每个 chip 摊到整行，版本号会漂到标题中间。 */
    .row .t .chips { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
    .row .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .meta { color: var(--dim); font-size: 12px; margin-top: 2px;
                 display: flex; gap: 10px; flex-wrap: wrap; }
    /* 会话卡：状态 chip 与其下方的活跃时间组成右对齐列 */
    .row .status-col { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: 0 0 100px; }
    .row .status-col .active-time { color: var(--dim); font-size: 11px; line-height: 1;
                                    white-space: nowrap; }
    .chip { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px;
            background: var(--panel-2); color: var(--accent); }
    .chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); }
    /* dsh 版本 chip：等宽 + 弱化色，与「已连接/未连接」状态 chip 在同一行里区分开 */
    .chip.ver { color: var(--dim); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    /* 会话状态 chip：图标 + 文本，运行中为实心强调，未知为虚线描边。
       nowrap：RECENT SESSIONS 右侧是窄列，标签（如「已保存」）被折成两行会撑高整行。 */
    .chip.status { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 4px 10px;
      border-radius: 6px; font-size: 12px; font-weight: 650; white-space: nowrap; }
    .status-symbol { font-size: 11px; font-weight: 700; }
    .chip.status.run { color: var(--panel); background: var(--ok); }
    .chip.status.done { color: var(--accent); background: var(--accent-soft); }
    .chip.status.idle { color: var(--dim); }
    .chip.status.unknown { color: var(--dim); background: transparent; border: 1px dashed var(--border); }
    .pressure { height: 4px; border-radius: 2px; background: var(--panel-2); margin-top: 6px; overflow: hidden; }
    .pressure > i { display: block; height: 100%; background: var(--accent); }
    .empty { color: var(--dim); padding: 14px; font-size: 13px; }
    /* 刷新/连接失败提示：醒目但不阻塞（dashboard 仍展示上一次成功的内容） */
    .note { margin: 0 0 10px; padding: 7px 12px; border-radius: 6px; font-size: 13px;
            background: color-mix(in srgb, var(--warn, #d08a2a) 18%, transparent);
            border: 1px solid color-mix(in srgb, var(--warn, #d08a2a) 45%, transparent);
            color: var(--fg); }
    .note[hidden] { display: none; }
    button { font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 5px; cursor: pointer;
             background: var(--panel-2); color: var(--fg); border: 1px solid var(--border); }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
    button.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
    button.danger:hover { border-color: var(--bad); color: var(--bad); }
    button:disabled { opacity: .5; cursor: default; }
    section > h2 button.add { float: right; text-transform: none; letter-spacing: 0; }
    .meta.actions button { padding: 0 8px; font-size: 11px; }
    .degraded-detail { color: var(--warn); word-break: break-all; }
    .home-form { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 14px;
                 border-bottom: 1px solid var(--border); }
    .home-form input, .home-form select { flex: 1 1 160px; font: inherit; font-size: 12px; padding: 5px 8px;
                                          background: var(--sunken); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; }
    .home-form input:focus, .home-form select:focus { outline: none; border-color: var(--accent); }
    .home-form .home-mode { flex: 0 0 auto; }
    .home-form .form-msg { flex-basis: 100%; font-size: 12px; color: var(--warn); }
    .home-form .form-msg.error { color: var(--bad); }
    .onboarding { grid-column: 1 / -1; padding: 24px 28px; max-width: 720px; }
    .onboarding h2 { margin: 0 0 10px; font-size: 19px; border: none; padding: 0;
                     color: var(--fg); text-transform: none; letter-spacing: 0;
                     font-family: var(--font-sans); font-weight: 700; }
    .onboarding p { color: var(--dim); margin: 8px 0; }
    .onboarding .hint { font-size: 12px; }
    .onboarding .home-form { padding: 12px 0 0; border: none; }
    .usage { grid-column: 1 / -1; }
    .usage-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr 1fr; gap: 8px; padding: 10px 14px; }
    .usage-big, .usage-stat { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; }
    .usage-big .num { display: block; font-size: 20px; font-weight: 700; color: var(--fg);
                      font-variant-numeric: tabular-nums; }
    .usage-big .cap, .usage-stat .c { font-size: 11px; color: var(--dim); }
    .usage-stat .n { display: block; font-size: 15px; font-weight: 600; color: var(--accent);
                     font-variant-numeric: tabular-nums; }
    /* 单条构成线：输入/缓存/输出按占比分段，不同颜色，悬停显示用量与占比 */
    .usage-stream { display: flex; height: 16px; margin: 4px 14px 2px; border-radius: 8px; overflow: hidden;
                    background: var(--sunken); box-shadow: inset 0 0 0 1px var(--border); }
    .usage-stream .seg { height: 100%; min-width: 6px; cursor: pointer; transition: filter .12s, opacity .12s; }
    .usage-stream .seg:hover { filter: brightness(1.3); }
    .usage-stream .seg.s-in { background: var(--accent); }
    .usage-stream .seg.s-out { background: var(--seg-out); }
    .usage-stream .seg.s-hit { background: var(--seg-hit); }
    .usage-stream .seg.s-write { background: var(--seg-write); }
    .usage-stream-cap { margin: 0 14px 6px; font-size: 11px; color: var(--dim); }
    /* 悬停 tooltip：fixed 定位到 body，绝不溢出/被裁剪 */
    .usage-stream-tip { position: fixed; z-index: 100; max-width: 280px; padding: 5px 9px; border-radius: 6px;
                        background: var(--tooltip-bg); border: 1px solid var(--border); color: var(--fg);
                        font-size: 12px; line-height: 1.4; pointer-events: none; display: flex; gap: 12px; align-items: baseline;
                        box-shadow: 0 4px 16px rgba(28,26,22,.12); white-space: nowrap; }
    .usage-stream-tip[hidden] { display: none !important; }
    .usage-stream-tip b { color: var(--fg); font-weight: 600; }
    .usage-stream-tip .t { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600; }
    .usage-stream-tip .p { color: var(--dim); }
    .usage-trend-block { padding: 6px 14px 10px; border-top: 1px solid var(--border); }
    .usage-trend-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .usage-trend-title { font-size: 12px; color: var(--dim); flex-shrink: 0; }
    .trend-toggle { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; }
    /* 维度切换：占满中间、横向滚动而非换行；范围说明固定右侧，避免被挤压/遮挡 */
    .trend-toggle.trend-dim { flex: 1 1 auto; min-width: 0; overflow-x: auto; padding-bottom: 2px; }
    .trend-toggle .usage-dim-btn { padding: 2px 9px; font-size: 11px; flex-shrink: 0; }
    .trend-toggle .usage-dim-btn.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
    .trend-range { flex-shrink: 0; font-size: 11px; color: var(--dim); white-space: nowrap; }
    .trend-toggle .usage-dim-btn, .trend-toggle .usage-period-btn { background: transparent; border: 1px solid var(--border); border-radius: 4px; color: var(--dim); cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
    .trend-toggle .usage-dim-btn:hover, .trend-toggle .usage-period-btn:hover { border-color: var(--accent); color: var(--fg); }
    .trend-toggle .usage-period-btn.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
    /* 周期切换：单行不换行，过宽横向滚动，避免遮挡/折行 */
    .usage-period-toggle { margin-top: 2px; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .usage-period-toggle .usage-period-btn { flex-shrink: 0; }
    /* 点图：左 Y 轴 + 主绘图区（水平网格线/平滑拟合曲线/数据点）+ 底部 X 轴 */
    .trend-chart { display: flex; gap: 6px; width: 100%; }
    .trend-y { position: relative; flex: 0 0 52px; height: 130px; }
    .trend-ytick { position: absolute; right: 2px; transform: translateY(50%); font-size: 10px; color: var(--dim); font-variant-numeric: tabular-nums; }
    .trend-main { flex: 1; min-width: 0; }
    .trend-plot { position: relative; height: 130px; }
    .trend-gridline { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--border); }
    .trend-line { position: absolute; inset: 0; width: 100%; height: 100%; }
    .trend-dot { position: absolute; width: 8px; height: 8px; border-radius: 50%; transform: translate(-50%, 50%);
                 border: 1px solid var(--dot-ring); box-shadow: 0 0 0 1px rgba(0,0,0,.10); cursor: pointer; transition: transform .12s; }
    .trend-dot:hover { transform: translate(-50%, 50%) scale(1.5); }
    /* X 轴：标签按**时间**定位（left% 与散点同一个函数），不是等分单元格 —— 见 usage-card.js 的注释 */
    .trend-x { position: relative; height: 14px; margin-top: 2px; }
    /* 默认居中在数据点上（与散点同一个 left%）。贴边的标签由 fitTrendLabels() 在渲染后
       按**实测**宽度加上 .trend-xlabel-left/right 改为向内对齐，相邻压字的直接隐藏 ——
       静态常量算不出真实宽度（实测 542px 绘图区里 12% 的间隔仍重叠 16px）。 */
    .trend-xlabel { position: absolute; top: 0; font-size: 10px; color: var(--dim); white-space: nowrap;
                    font-variant-numeric: tabular-nums; transform: translateX(-50%); }
    .trend-xlabel-left { transform: translateX(0); }
    .trend-xlabel-right { transform: translateX(-100%); }
    .trend-xlabel[hidden] { display: none; }
    .trend-caption { margin-top: 6px; font-size: 11px; color: var(--dim); }
    .trend-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; }
    .trend-legend-item { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--dim); }
    .trend-legend-item i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
    .usage-projects { padding: 2px 14px 10px; }
    .usage-projects .up-row { justify-content: space-between; }
    .usage-grid + .meta { padding-left: 14px; }

    /* 运行日志面板（grid 内跨整行） */
    .logs { grid-column: 1 / -1; }
    .logs > h2 { display: flex; align-items: center; gap: 8px; }
    .logs .log-live { margin-left: auto; font-size: 11px; font-weight: 400; color: var(--dim);
                      display: inline-flex; align-items: center; gap: 5px; }
    .logs .log-live i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok);
                        animation: logpulse 2s infinite; }
    @keyframes logpulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    .logs .log-tools { display: flex; gap: 4px; }
    .log-fbtn { padding: 1px 8px; font-size: 11px; border-radius: 4px; background: transparent;
                border: 1px solid var(--border); color: var(--dim); cursor: pointer; }
    .log-fbtn:hover { border-color: var(--accent); color: var(--fg); }
    .log-fbtn.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
    .log-body { max-height: 520px; overflow-y: auto; padding: 6px 10px; font-size: 12px; line-height: 1.45;
                font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .log-body::-webkit-scrollbar { width: 8px; }
    .log-body::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 4px; }
    .log-body::-webkit-scrollbar-track { background: transparent; }
    .log-row { padding: 2px 4px; border-bottom: 1px solid var(--border); white-space: pre-wrap;
               word-break: break-all; cursor: default; }
    .log-row:hover { background: var(--hover); }
    .log-row .log-ts { color: var(--dim); margin-right: 8px; }
    .log-row .log-lvl { display: inline-block; width: 46px; font-weight: 600; }
    .log-row.debug .log-lvl { color: var(--dim); }
    .log-row.info .log-lvl { color: var(--accent); }
    .log-row.warn .log-lvl { color: var(--warn); }
    .log-row.error .log-lvl { color: var(--bad); }
    .log-row .log-scope { color: var(--log-scope); margin-right: 8px; }
    .log-row.warn .log-msg { color: var(--log-warn-msg); }
    .log-row.error .log-msg { color: var(--log-error-msg); }
    .log-row .log-fields { color: var(--dim); }
    .log-stack { margin: 4px 0 0 54px; padding: 6px 8px; background: var(--sunken); border: 1px solid var(--border);
                 border-radius: 4px; color: var(--code-fg); font-family: inherit; font-size: 11px;
                 overflow-x: auto; white-space: pre; }

    /* 实例视图：全高 iframe（去掉顶部条，切回工作台走顶部 tab）。右上角浮层仅悬停可见。 */
    .iframe-pane { position: relative; display: flex; flex-direction: column; overflow: hidden; }
    .iframe-pane iframe { flex: 1; width: 100%; border: none; background: #fff; }
    .frame-loading { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--dim); }
    /* 加载遮罩：盖住 iframe, 把 dsh web 每次全量重载时的白闪遮成面板色加载态 */
    .frame-cover { position: absolute; inset: 0; z-index: 4; display: flex; align-items: center;
                   justify-content: center; background: var(--bg); color: var(--dim); font-size: 14px; }
    .frame-cover[hidden] { display: none !important; }


    @media (max-width: 1100px) {
      #dashboard[data-layout=grid] { grid-template-columns: 230px minmax(0, 1fr); }
      #dashboard[data-layout=grid] > .pane-instances { grid-column: 1 / -1; height: auto; }
      .pane-instances > .rows { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      #topbar { grid-template-columns: 230px minmax(0, 1fr) 32px; gap: 16px; }
    }
    @media (max-width: 720px) {
      #topbar { grid-template-columns: minmax(0, 1fr) 32px; gap: 10px; padding: 10px 12px; }
      .topbar-start { grid-column: 1; } .topbar-right { grid-column: 2; grid-row: 1; }
      #search-wrap { grid-column: 1 / -1; grid-row: 2; max-width: none; }
      #dashboard[data-layout=grid] { grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 12px; }
      #dashboard[data-layout=grid] > .pane { height: auto; }
      #dashboard[data-layout=grid] > .pane-sessions { grid-row: 1; }
      #dashboard[data-layout=grid] > .pane-projects { grid-row: 2; }
      .pane > .rows, .session-list { max-height: 65dvh; }
      .pane-instances > .rows { display: block; max-height: none; }
      .pane-filter { gap: 6px; }
      .session-order { display: none; }
    }
    @media (max-width: 420px) {
      .row.session-card .t { flex-direction: column; gap: 8px; }
      .row .status-col { flex: none; flex-direction: row; align-items: center; }
      .sid { display: none; }
    }

    /* 实例设置弹层 */
    .modal { position: fixed; inset: 0; background: var(--overlay); display: flex;
             align-items: center; justify-content: center; z-index: 50; }
    .modal[hidden] { display: none !important; }
    .modal-card { width: min(520px, 92vw); background: var(--panel); border: 1px solid var(--border);
                  border-radius: 12px; padding: 16px 18px; box-shadow: 0 16px 48px rgba(20,19,16,.22);
                  max-height: calc(100dvh - 32px); overflow-y: auto; box-sizing: border-box; }
    .modal-card h3 { margin: 0 0 12px; font-size: 16px; color: var(--fg);
                     font-family: var(--font-sans); font-weight: 600; }
    .modal-card .home-form { border: none; padding: 0; margin-bottom: 6px; }
    .modal-card .meta.readonly { flex-basis: 100%; font-size: 12px; color: var(--dim); word-break: break-all; }
    .home-form .meta.readonly code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px;
                                     background: var(--sunken); padding: 1px 4px; border-radius: 4px; color: var(--accent); }
    .home-form .meta.readonly .hint-strong { display: block; margin-top: 4px; color: var(--warn); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    .modal-actions button.primary { color: var(--on-accent); }

    /* —— 右上角：搜索框 + 主题切换（设置按钮 + 下拉菜单） —— */
    .topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; margin-left: 8px; }

    /* 顶栏全局搜索与会话列共用网格，上限 520px；窄屏放入独立第二行。 */
    .search-wrap { position: relative; display: flex; align-items: center; width: 100%; max-width: 520px; min-width: 0; justify-self: center; grid-column: 2; }
    .search-wrap[hidden] { display: none !important; }
    .search-icon { position: absolute; left: 9px; color: var(--dim); pointer-events: none; }
    .search-input { width: 100%; min-width: 0; height: 38px; padding: 0 64px 0 32px;
                    font: inherit; font-size: 13px; color: var(--fg); background: var(--sunken);
                    border: 1px solid var(--border); border-radius: 6px; outline: none;
                    transition: border-color .15s, background .15s, box-shadow .15s; }
    .search-input::placeholder { color: var(--dim); }
    .search-input:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
    .search-input:focus { background: var(--panel); border-color: var(--accent);
                          box-shadow: 0 0 0 3px var(--accent-soft); }
    /* type=search 的原生清除按钮会和我们自己的 ✕ 重复，隐藏原生那个 */
    .search-input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
    .search-clear { position: absolute; right: 5px; display: inline-flex; align-items: center;
                    justify-content: center; width: 20px; height: 20px; padding: 0; font-size: 11px;
                    line-height: 1; color: var(--dim); background: transparent; border: none;
                    border-radius: 4px; cursor: pointer; }
    .search-clear:hover { color: var(--fg); background: var(--hover); }
    .search-clear[hidden] { display: none !important; }
    .search-shortcut { position: absolute; right: 32px; color: var(--dim); font: 11px var(--font-sans); pointer-events: none; }
    .search-scope { position: absolute; top: 50%; transform: translateY(-50%); left: 30px; max-width: 130px; padding: 3px 7px; background: var(--panel); color: var(--accent); border: 1px solid var(--accent-line); border-radius: 5px; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .search-scope[hidden], .search-results[hidden] { display: none !important; }
    .search-wrap.has-scope .search-input { padding-left: 170px; }
    .search-results { position: absolute; top: calc(100% + 8px); left: 0; width: 100%; max-height: min(70dvh, 640px); overflow-y: auto;
      background: var(--panel); border: 1px solid var(--border); border-radius: 9px; box-shadow: 0 10px 32px var(--overlay); padding: 6px; z-index: 30; }
    .search-result-heading { display: flex; gap: 8px; justify-content: space-between; align-items: center; color: var(--dim); font-size: 11px; padding: 7px; }
    .search-result-heading button { font-size: 11px; }
    .search-result-group + .search-result-group { border-top: 1px solid var(--border); margin-top: 6px; }
    .search-result-group h3 { margin: 0; padding: 7px; font-size: 11px; font-weight: 500; color: var(--dim); }
    button.search-result { display: flex; align-items: center; gap: 10px; text-align: left; width: 100%; padding: 10px 8px; color: var(--fg); background: transparent; border: 0; }
    button.search-result:hover, button.search-result:focus-visible { background: var(--hover); }
    .search-result-body { min-width: 0; flex: 1; }
    .search-result-name { display: block; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .search-result-meta { display: block; font-size: 11px; color: var(--dim); }
    .search-result-note { padding: 9px; color: var(--dim); font-size: 12px; }
    .project-last-active { color: var(--dim); font-size: 11px; }
    @media (max-width: 520px) { .search-scope { max-width: 106px; } .search-wrap.has-scope .search-input { padding-left: 144px; } .search-result { flex-wrap: wrap; } }
    @media (pointer: coarse) { .search-input { font-size: 16px; } button, summary { min-height: 36px; } }
    /* 过滤后 0 条：空态里直接给「清除搜索」，不是干巴巴一句「没有」 */
    .search-empty { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .search-empty button { padding: 0 8px; font-size: 11px; }
    /* 全库检索补出的历史行：虚线边框 + 弱化文字，区别于「最近列表」里本来就在的行。
       不用实心底色：它只是来源说明，不该抢过项目徽标/状态轨这两个第一视觉锚点。 */
    .chip.hist-chip { background: transparent; border: 1px dashed var(--border); color: var(--dim); }
    /* 命中数超过返回上限时的提示：贴着列表底部，语气是说明而不是报错。 */
    .search-more { padding: 6px 2px; font-size: 11px; color: var(--dim); }

    .theme-wrap { position: relative; }
    .icon-btn { display: inline-flex; width: 30px; height: 30px; align-items: center; justify-content: center;
                padding: 0; font-size: 15px; line-height: 1; border: 1px solid var(--border); border-radius: 6px;
                background: var(--panel); color: var(--fg); cursor: pointer;
                transition: border-color .15s, background .15s, color .15s; }
    .icon-btn:hover { border-color: var(--accent); background: var(--hover); color: var(--accent); }
    .menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 40; min-width: 170px;
            background: var(--tooltip-bg); border: 1px solid var(--border); border-radius: 8px;
            box-shadow: 0 8px 28px rgba(20,19,16,.16); padding: 6px; }
    .menu[hidden] { display: none !important; }
    .menu-heading { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .02em;
                    font-family: var(--font-sans); font-weight: 600; padding: 4px 10px 6px; }
    .menu-item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px;
                 font: inherit; font-size: 13px; color: var(--fg); background: transparent; border: none;
                 border-radius: 6px; cursor: pointer; text-align: left; transition: background .12s, color .12s; }
    .menu-item:hover { background: var(--hover); }
    .menu-item.active { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
    .menu-item .mk { margin-left: auto; font-weight: 700; color: var(--accent); opacity: 0; }
    .menu-item.active .mk { opacity: 1; }
    /* 主题同步开关：与上面的三选一是两种语义（一组互斥选择 vs 一个布尔开关），
       用一条细分隔线分开，并让开关的选中态同样落在 .mk 对勾上。 */
    .menu-sep { height: 1px; margin: 5px 6px; background: var(--border); }
    .menu-toggle-label { flex: 1; }
    .menu-toggle[aria-checked="true"] .mk { opacity: 1; }
    .menu-toggle[aria-checked="true"] { color: var(--accent); }
  .endpoint-editor { flex-basis: 100%; border: 1px solid var(--border, #ddd); border-radius: 8px; padding: 12px; min-width: 0; }
    .endpoint-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(100px, .55fr); gap: 10px 12px; padding: 14px 0; border-bottom: 1px solid var(--border, #ddd); }
    .endpoint-row input, .endpoint-switch select { min-width: 0; max-width: 100%; }
    .config-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 200px; font-size: 12px; color: var(--fg); }
    .config-field > span { font-weight: 500; }
    .config-field small { color: var(--dim); font-weight: normal; margin-left: 4px; }
    .home-form .config-field input, .home-form .config-field select { flex: none; width: 100%; box-sizing: border-box; }
    .endpoint-token, .endpoint-row-actions { grid-column: 1 / -1; }
    .endpoint-row-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .endpoint-editor > .meta { margin: 4px 0 0; line-height: 1.6; }
    .endpoint-editor > button { margin-top: 12px; }
    .endpoint-switch { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; width: 100%; }
    .endpoint-switch .config-field { flex: 1; }
    .endpoint-switch select { width: 100%; box-sizing: border-box; font: inherit; }

    /* 本地工具实例卡上的身份 chip（Codex / WorkBuddy / 本地 dsh 只读）。
       三种工具共用同一张卡，身份靠**项目色**区分（与 Projects 栏的来源底色同源），
       绝不用状态色（ok/warn/bad）—— 那是「已就绪 / 路径缺失」的语义，混在一起会让
       读者把「这是哪个工具」误读成「这个实例是什么状态」。 */
    .chip.harness-codex,
    .chip.harness-workbuddy,
    .chip.harness-dsh { flex: none; color: var(--fg); border: 1px solid; }
    .chip.harness-codex { background: var(--src-codex); border-color: var(--src-codex-line); }
    .chip.harness-workbuddy { background: var(--src-workbuddy); border-color: var(--src-workbuddy-line); }
    .chip.harness-dsh { background: var(--src-dsh); border-color: var(--src-dsh-line); }
    </style>
</head>
<body>
  <header id="topbar">
    <div class="topbar-start">
    <div class="brand">(=hωb=) <span id="live" class="live">connecting…</span></div>
    <div id="tabs" class="tabbar"></div>
    </div>
      <!-- 顶栏搜索：按名字过滤 Recent Projects / Recent Sessions（见 app.js 的 setSearchQuery）。
           只作用于工作台列表；切到实例视图时由 showView() 隐藏。 -->
      <div id="search-wrap" class="search-wrap" role="search">
        <svg class="search-icon" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" focusable="false">
          <circle cx="7" cy="7" r="4.4" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
          <path d="M10.3 10.3 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
        </svg>
        <input id="search" class="search-input" type="search" placeholder="搜索项目或会话…"
               aria-label="搜索项目或会话（⌘K 或 Ctrl+K 聚焦，Esc 清空）" aria-controls="search-results"
               autocomplete="off" autocapitalize="off" spellcheck="false">
        <kbd class="search-shortcut" aria-hidden="true">⌘K</kbd>
        <button id="search-clear" class="search-clear" type="button" data-action="clear-search"
                title="清除搜索 (Esc)" aria-label="清除搜索" hidden>✕</button>
        <button id="search-scope" class="search-scope" type="button" data-action="clear-search-scope" aria-label="清除项目搜索范围" hidden></button>
        <div id="search-results" class="search-results" role="region" aria-label="搜索结果" hidden></div>
      </div>
    <div class="topbar-right">
      <div class="theme-wrap">
        <button id="theme-btn" class="icon-btn" title="选择界面外观" aria-haspopup="true"
                aria-label="切换主题（白天/黑夜/跟随系统）">🌓</button>
        <div id="theme-menu" class="menu" hidden>
          <div class="menu-heading">界面外观</div>
          <button class="menu-item" data-mode="light" role="menuitem"><span>☀️</span>白天<span class="mk">✓</span></button>
          <button class="menu-item" data-mode="dark" role="menuitem"><span>🌙</span>黑夜<span class="mk">✓</span></button>
          <button class="menu-item" data-mode="system" role="menuitem"><span>💻</span>跟随系统<span class="mk">✓</span></button>
          <!-- 主题同步开关：hwb 是权威、dsh 跟随（单向下发）。默认开启 ——
               「hwb 与 dsh 外观一致」是这个功能的全部意义，要求用户先找到开关才生效不合理。 -->
          <div class="menu-sep" role="separator"></div>
          <button id="theme-sync" class="menu-item menu-toggle" role="menuitemcheckbox" aria-checked="true"
                  title="切换主题时同步给已连接的 dsh 实例（写入其 settings.yaml）">
            <span>🔄</span><span class="menu-toggle-label">同步到 dsh 实例</span><span class="mk">✓</span>
          </button>
        </div>
      </div>
    </div>
  </header>
  <main id="main">
    <!-- 刷新/连接失败提示：挂在 dashboard 之外，dashboard 每轮 SSE 刷新都会重建 innerHTML -->
    <div id="note" class="note" role="status" aria-live="polite" hidden></div>
    <div id="dashboard" class="view" data-layout="grid"><div class="empty">loading…</div></div>
  </main>
  <div id="modal" class="modal" hidden></div>
  <!-- 首帧前应用已保存的主题，避免刷新闪一下（亮→暗切换） -->
  <script>
    (function () {
      try {
        var m = localStorage.getItem('hwb:theme');
        document.documentElement.setAttribute('data-theme', (m === 'light' || m === 'dark') ? m : 'system');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'system'); }
    })();
  </script>
  <script type="module" src="/app.js"></script>
</body>
</html>
