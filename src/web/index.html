<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hwb — harness workbench</title>
  <!-- 网页标题图标：优先 SVG（现代浏览器清晰/可缩放），PNG/ICO 作回退，另配 apple-touch -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      /* 浅色主题（默认）：暖纸白画布 + 墨色文字 + 细灰边框 + 墨蓝 accent */
      --bg: #f7f6f3; --panel: #fdfdfc; --panel-2: #f0efeb; --border: #e3e1db;
      --fg: #1f2328; --dim: #6f6a61; --accent: #3e5c94; --accent-2: #33497a;
      --accent-soft: rgba(62, 92, 148, .09); --accent-line: rgba(62, 92, 148, .38);
      --on-accent: #ffffff; --hover: #eeece7;
      --ok: #3f7d5d; --warn: #a37b2a; --bad: #a8463f;
      /* 浅色专属 surface / 文本 token（深色主题各自覆盖） */
      --sunken: #efede8; --tooltip-bg: #fdfdfc; --scroll: #cfcbc2; --code-fg: #3a3f47;
      --proj-bg: #f3ecdd; --proj-fg: #7d6420; --overlay: rgba(28,26,22,.38);
      --log-scope: #3d7a6e; --log-warn-msg: #8f6d24; --log-error-msg: #96423a;
      --dot-ring: #fdfdfc; --seg-out: #5d8a72; --seg-hit: #5a8a94; --seg-write: #b08a3e;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    }
    /* 深色主题：手动选择「黑夜」时生效 */
    :root[data-theme="dark"] {
      --bg: #141518; --panel: #1b1d22; --panel-2: #22252c; --border: #2c2f37;
      --fg: #d8d5cf; --dim: #8b887f; --accent: #8fa5c9; --accent-2: #a5b8d6;
      --accent-soft: rgba(143, 165, 201, .13); --accent-line: rgba(143, 165, 201, .45);
      --on-accent: #14171f; --hover: #262930;
      --ok: #6fae8f; --warn: #c9a35c; --bad: #c97b72;
      --sunken: #1e2026; --tooltip-bg: #22252c; --scroll: #3a3e48; --code-fg: #b3b0a8;
      --proj-bg: #34301f; --proj-fg: #c9b06a; --overlay: rgba(5,6,8,.62);
      --log-scope: #7fae9f; --log-warn-msg: #c9b184; --log-error-msg: #d3988f;
      --dot-ring: #1b1d22; --seg-out: #6f9a82; --seg-hit: #6f9aa4; --seg-write: #bfa05c;
    }
    /* 深色主题（跟随系统）：未显式选「白天」时，系统切暗就跟随 */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #141518; --panel: #1b1d22; --panel-2: #22252c; --border: #2c2f37;
        --fg: #d8d5cf; --dim: #8b887f; --accent: #8fa5c9; --accent-2: #a5b8d6;
        --accent-soft: rgba(143, 165, 201, .13); --accent-line: rgba(143, 165, 201, .45);
        --on-accent: #14171f; --hover: #262930;
        --ok: #6fae8f; --warn: #c9a35c; --bad: #c97b72;
        --sunken: #1e2026; --tooltip-bg: #22252c; --scroll: #3a3e48; --code-fg: #b3b0a8;
        --proj-bg: #34301f; --proj-fg: #c9b06a; --overlay: rgba(5,6,8,.62);
        --log-scope: #7fae9f; --log-warn-msg: #c9b184; --log-error-msg: #d3988f;
        --dot-ring: #1b1d22; --seg-out: #6f9a82; --seg-hit: #6f9aa4; --seg-write: #bfa05c;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); display: flex; flex-direction: column;
           min-height: 100vh; font: 14px/1.55 var(--font-sans); }

    /* 顶部 bar：品牌 + 实例 tab 卡（可拖动排序） */
    #topbar { display: flex; align-items: center; gap: 16px; padding: 0 14px; height: 46px;
              border-bottom: 1px solid var(--border); background: var(--panel);
              flex-shrink: 0; position: sticky; top: 0; z-index: 10; }
    #topbar .brand { font-size: 17px; font-weight: 700; display: flex; gap: 10px; align-items: baseline;
                     flex-shrink: 0; font-family: var(--font-sans); letter-spacing: -.02em; }
    #topbar .brand .live { font-size: 12px; font-weight: 400; color: var(--dim);
                           font-family: var(--font-sans); }
    #topbar .brand .live.on { color: var(--ok); }
    /* 选项卡：独立「胶囊」造型，选中态用墨蓝淡底 + 细描边标识 */
    .tabbar { display: flex; align-items: center; gap: 6px; overflow-x: auto; min-width: 0; flex: 1; }
    .tab { display: flex; align-items: center; gap: 8px; padding: 6px 12px; height: auto;
           border: 1px solid transparent; border-radius: 6px; background: transparent;
           color: var(--dim); font: inherit; font-size: 13px; line-height: 1;
           cursor: pointer; white-space: nowrap; flex-shrink: 0;
           transition: color .16s, background .16s, border-color .16s, box-shadow .16s; }
    .tab:hover { color: var(--fg); background: var(--hover); border-color: var(--border); }
    .tab.active { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-line); }
    .tab-popout { margin-left: -4px; padding: 6px; color: var(--accent); }
    .tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex-shrink: 0; }
    .tab .dot.running { background: var(--ok); box-shadow: 0 0 0 2px var(--accent-soft); }
    .tab .dot.unreachable { background: var(--warn); }
    .tab .dot.gone { background: var(--bad); }
    .tab .label { overflow: hidden; text-overflow: ellipsis; }
    .tab[draggable=true] { cursor: grab; }
    .tab.dragging { opacity: .4; }
    .tab.drag-target { box-shadow: 0 0 0 2px var(--accent); }

    #main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column;
            overflow: hidden; }
    /* 视图面板：工作台 / 每个实例一个持久 iframe。切换只 show/hide，不销毁重建。 */
    .view { flex: 1; min-height: 0; }
    .view[hidden] { display: none !important; }
    #dashboard[data-layout=grid] { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 14px;
                                   padding: 14px 20px; align-content: start; overflow-y: auto; }
    #dashboard[data-layout=onboarding] { padding: 24px 28px; overflow-y: auto; }

    section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    section > h2 { margin: 0; padding: 10px 14px; font-size: 12px; color: var(--dim);
                   border-bottom: 1px solid var(--border); text-transform: uppercase;
                   letter-spacing: .02em; font-family: var(--font-sans); font-weight: 600; }
    .rows { padding: 6px; }
    /* 顶栏三张列表卡：内容超过可视高度时，列表自身滚动（不撑长整页） */
    #dashboard[data-layout=grid] > section:nth-child(-n+3) > .rows {
      max-height: calc(100vh - 160px);
      overflow-y: auto;
    }
    #dashboard[data-layout=grid] .rows::-webkit-scrollbar { width: 8px; }
    #dashboard[data-layout=grid] .rows::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 4px; }
    #dashboard[data-layout=grid] .rows::-webkit-scrollbar-track { background: transparent; }
    .row { padding: 8px 10px; border-radius: 6px; }
    .row:hover { background: var(--hover); }
    .row.clickable { cursor: pointer; }
    /* 联动高亮：悬停 Projects ↔ Sessions 相互高亮 */
    .row.hl-project { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
    .chip.home-chip { background: var(--accent-soft); color: var(--accent); }
    .chip.proj-chip { background: var(--proj-bg); color: var(--proj-fg); }
    .row .t { display: flex; justify-content: space-between; gap: 8px; }
    /* 实例卡右上角的 chip 组：版本号 + 连接状态 + 降级提示。收进一个 flex 容器，
       否则 .t 的 space-between 会把每个 chip 摊到整行，版本号会漂到标题中间。 */
    .row .t .chips { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
    .row .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .meta { color: var(--dim); font-size: 12px; margin-top: 2px;
                 display: flex; gap: 10px; flex-wrap: wrap; }
    /* 会话卡：状态 chip 与其下方的活跃时间组成右对齐列 */
    .row .status-col { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    .row .status-col .active-time { color: var(--dim); font-size: 11px; line-height: 1;
                                    white-space: nowrap; }
    .chip { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px;
            background: var(--panel-2); color: var(--accent); }
    .chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); }
    /* dsh 版本 chip：等宽 + 弱化色，与「已连接/未连接」状态 chip 在同一行里区分开 */
    .chip.ver { color: var(--dim); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    /* 会话状态 chip：彩色圆点 + 文本。run=运行中(green)，done=已完成(accent)，idle=空闲(dim) */
    .chip.status { display: inline-flex; align-items: center; gap: 4px; padding-right: 9px; }
    .chip.status::before { content: ''; width: 6px; height: 6px; border-radius: 50%;
                           background: currentColor; flex: none; }
    .chip.status.run { color: var(--ok); }
    .chip.status.done { color: var(--accent); }
    .chip.status.idle { color: var(--dim); }
    .pressure { height: 4px; border-radius: 2px; background: var(--panel-2); margin-top: 6px; overflow: hidden; }
    .pressure > i { display: block; height: 100%; background: var(--accent); }
    .empty { color: var(--dim); padding: 14px; font-size: 13px; }
    /* 刷新/连接失败提示：醒目但不阻塞（dashboard 仍展示上一次成功的内容） */
    .note { margin: 0 0 10px; padding: 7px 12px; border-radius: 6px; font-size: 13px;
            background: color-mix(in srgb, var(--warn, #d08a2a) 18%, transparent);
            border: 1px solid color-mix(in srgb, var(--warn, #d08a2a) 45%, transparent);
            color: var(--fg); }
    .note[hidden] { display: none; }
    button { font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 5px; cursor: pointer;
             background: var(--panel-2); color: var(--fg); border: 1px solid var(--border); }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
    button.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
    button.danger:hover { border-color: var(--bad); color: var(--bad); }
    button:disabled { opacity: .5; cursor: default; }
    section > h2 button.add { float: right; text-transform: none; letter-spacing: 0; }
    .meta.actions button { padding: 0 8px; font-size: 11px; }
    .degraded-detail { color: var(--warn); word-break: break-all; }
    .home-form { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 14px;
                 border-bottom: 1px solid var(--border); }
    .home-form input, .home-form select { flex: 1 1 160px; font: inherit; font-size: 12px; padding: 5px 8px;
                                          background: var(--sunken); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; }
    .home-form input:focus, .home-form select:focus { outline: none; border-color: var(--accent); }
    .home-form .home-mode { flex: 0 0 auto; }
    .home-form .form-msg { flex-basis: 100%; font-size: 12px; color: var(--warn); }
    .home-form .form-msg.error { color: var(--bad); }
    .onboarding { grid-column: 1 / -1; padding: 24px 28px; max-width: 720px; }
    .onboarding h2 { margin: 0 0 10px; font-size: 19px; border: none; padding: 0;
                     color: var(--fg); text-transform: none; letter-spacing: 0;
                     font-family: var(--font-sans); font-weight: 700; }
    .onboarding p { color: var(--dim); margin: 8px 0; }
    .onboarding .hint { font-size: 12px; }
    .onboarding .home-form { padding: 12px 0 0; border: none; }
    .usage { grid-column: 1 / -1; }
    .usage-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr 1fr; gap: 8px; padding: 10px 14px; }
    .usage-big, .usage-stat { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; }
    .usage-big .num { display: block; font-size: 20px; font-weight: 700; color: var(--fg);
                      font-variant-numeric: tabular-nums; }
    .usage-big .cap, .usage-stat .c { font-size: 11px; color: var(--dim); }
    .usage-stat .n { display: block; font-size: 15px; font-weight: 600; color: var(--accent);
                     font-variant-numeric: tabular-nums; }
    /* 单条构成线：输入/缓存/输出按占比分段，不同颜色，悬停显示用量与占比 */
    .usage-stream { display: flex; height: 16px; margin: 4px 14px 2px; border-radius: 8px; overflow: hidden;
                    background: var(--sunken); box-shadow: inset 0 0 0 1px var(--border); }
    .usage-stream .seg { height: 100%; min-width: 6px; cursor: pointer; transition: filter .12s, opacity .12s; }
    .usage-stream .seg:hover { filter: brightness(1.3); }
    .usage-stream .seg.s-in { background: var(--accent); }
    .usage-stream .seg.s-out { background: var(--seg-out); }
    .usage-stream .seg.s-hit { background: var(--seg-hit); }
    .usage-stream .seg.s-write { background: var(--seg-write); }
    .usage-stream-cap { margin: 0 14px 6px; font-size: 11px; color: var(--dim); }
    /* 悬停 tooltip：fixed 定位到 body，绝不溢出/被裁剪 */
    .usage-stream-tip { position: fixed; z-index: 100; max-width: 280px; padding: 5px 9px; border-radius: 6px;
                        background: var(--tooltip-bg); border: 1px solid var(--border); color: var(--fg);
                        font-size: 12px; line-height: 1.4; pointer-events: none; display: flex; gap: 12px; align-items: baseline;
                        box-shadow: 0 4px 16px rgba(28,26,22,.12); white-space: nowrap; }
    .usage-stream-tip[hidden] { display: none !important; }
    .usage-stream-tip b { color: var(--fg); font-weight: 600; }
    .usage-stream-tip .t { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600; }
    .usage-stream-tip .p { color: var(--dim); }
    .usage-trend-block { padding: 6px 14px 10px; border-top: 1px solid var(--border); }
    .usage-trend-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .usage-trend-title { font-size: 12px; color: var(--dim); flex-shrink: 0; }
    .trend-toggle { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; }
    /* 维度切换：占满中间、横向滚动而非换行；范围说明固定右侧，避免被挤压/遮挡 */
    .trend-toggle.trend-dim { flex: 1 1 auto; min-width: 0; overflow-x: auto; padding-bottom: 2px; }
    .trend-toggle .usage-dim-btn { padding: 2px 9px; font-size: 11px; flex-shrink: 0; }
    .trend-toggle .usage-dim-btn.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
    .trend-range { flex-shrink: 0; font-size: 11px; color: var(--dim); white-space: nowrap; }
    .trend-toggle .usage-dim-btn, .trend-toggle .usage-period-btn { background: transparent; border: 1px solid var(--border); border-radius: 4px; color: var(--dim); cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
    .trend-toggle .usage-dim-btn:hover, .trend-toggle .usage-period-btn:hover { border-color: var(--accent); color: var(--fg); }
    .trend-toggle .usage-period-btn.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
    /* 周期切换：单行不换行，过宽横向滚动，避免遮挡/折行 */
    .usage-period-toggle { margin-top: 2px; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .usage-period-toggle .usage-period-btn { flex-shrink: 0; }
    /* 点图：左 Y 轴 + 主绘图区（水平网格线/平滑拟合曲线/数据点）+ 底部 X 轴 */
    .trend-chart { display: flex; gap: 6px; width: 100%; }
    .trend-y { position: relative; flex: 0 0 52px; height: 130px; }
    .trend-ytick { position: absolute; right: 2px; transform: translateY(50%); font-size: 10px; color: var(--dim); font-variant-numeric: tabular-nums; }
    .trend-main { flex: 1; min-width: 0; }
    .trend-plot { position: relative; height: 130px; }
    .trend-gridline { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--border); }
    .trend-line { position: absolute; inset: 0; width: 100%; height: 100%; }
    .trend-dot { position: absolute; width: 8px; height: 8px; border-radius: 50%; transform: translate(-50%, 50%);
                 border: 1px solid var(--dot-ring); box-shadow: 0 0 0 1px rgba(0,0,0,.10); cursor: pointer; transition: transform .12s; }
    .trend-dot:hover { transform: translate(-50%, 50%) scale(1.5); }
    /* X 轴：标签按**时间**定位（left% 与散点同一个函数），不是等分单元格 —— 见 usage-card.js 的注释 */
    .trend-x { position: relative; height: 14px; margin-top: 2px; }
    /* 默认居中在数据点上（与散点同一个 left%）。贴边的标签由 fitTrendLabels() 在渲染后
       按**实测**宽度加上 .trend-xlabel-left/right 改为向内对齐，相邻压字的直接隐藏 ——
       静态常量算不出真实宽度（实测 542px 绘图区里 12% 的间隔仍重叠 16px）。 */
    .trend-xlabel { position: absolute; top: 0; font-size: 10px; color: var(--dim); white-space: nowrap;
                    font-variant-numeric: tabular-nums; transform: translateX(-50%); }
    .trend-xlabel-left { transform: translateX(0); }
    .trend-xlabel-right { transform: translateX(-100%); }
    .trend-xlabel[hidden] { display: none; }
    .trend-caption { margin-top: 6px; font-size: 11px; color: var(--dim); }
    .trend-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; }
    .trend-legend-item { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--dim); }
    .trend-legend-item i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
    .usage-projects { padding: 2px 14px 10px; }
    .usage-projects .up-row { justify-content: space-between; }
    .usage-grid + .meta { padding-left: 14px; }

    /* 运行日志面板（grid 内跨整行） */
    .logs { grid-column: 1 / -1; }
    .logs > h2 { display: flex; align-items: center; gap: 8px; }
    .logs .log-live { margin-left: auto; font-size: 11px; font-weight: 400; color: var(--dim);
                      display: inline-flex; align-items: center; gap: 5px; }
    .logs .log-live i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok);
                        animation: logpulse 2s infinite; }
    @keyframes logpulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    .logs .log-tools { display: flex; gap: 4px; }
    .log-fbtn { padding: 1px 8px; font-size: 11px; border-radius: 4px; background: transparent;
                border: 1px solid var(--border); color: var(--dim); cursor: pointer; }
    .log-fbtn:hover { border-color: var(--accent); color: var(--fg); }
    .log-fbtn.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
    .log-body { max-height: 520px; overflow-y: auto; padding: 6px 10px; font-size: 12px; line-height: 1.45;
                font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .log-body::-webkit-scrollbar { width: 8px; }
    .log-body::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 4px; }
    .log-body::-webkit-scrollbar-track { background: transparent; }
    .log-row { padding: 2px 4px; border-bottom: 1px solid var(--border); white-space: pre-wrap;
               word-break: break-all; cursor: default; }
    .log-row:hover { background: var(--hover); }
    .log-row .log-ts { color: var(--dim); margin-right: 8px; }
    .log-row .log-lvl { display: inline-block; width: 46px; font-weight: 600; }
    .log-row.debug .log-lvl { color: var(--dim); }
    .log-row.info .log-lvl { color: var(--accent); }
    .log-row.warn .log-lvl { color: var(--warn); }
    .log-row.error .log-lvl { color: var(--bad); }
    .log-row .log-scope { color: var(--log-scope); margin-right: 8px; }
    .log-row.warn .log-msg { color: var(--log-warn-msg); }
    .log-row.error .log-msg { color: var(--log-error-msg); }
    .log-row .log-fields { color: var(--dim); }
    .log-stack { margin: 4px 0 0 54px; padding: 6px 8px; background: var(--sunken); border: 1px solid var(--border);
                 border-radius: 4px; color: var(--code-fg); font-family: inherit; font-size: 11px;
                 overflow-x: auto; white-space: pre; }

    /* 实例视图：全高 iframe（去掉顶部条，切回工作台走顶部 tab）。右上角浮层仅悬停可见。 */
    .iframe-pane { position: relative; display: flex; flex-direction: column; overflow: hidden; }
    .iframe-pane iframe { flex: 1; width: 100%; border: none; background: #fff; }
    .frame-loading { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--dim); }
    /* 加载遮罩：盖住 iframe, 把 dsh web 每次全量重载时的白闪遮成面板色加载态 */
    .frame-cover { position: absolute; inset: 0; z-index: 4; display: flex; align-items: center;
                   justify-content: center; background: var(--bg); color: var(--dim); font-size: 14px; }
    .frame-cover[hidden] { display: none !important; }


    @media (max-width: 1100px) { #dashboard[data-layout=grid] { grid-template-columns: 1fr; } }

    /* 实例设置弹层 */
    .modal { position: fixed; inset: 0; background: var(--overlay); display: flex;
             align-items: center; justify-content: center; z-index: 50; }
    .modal[hidden] { display: none !important; }
    .modal-card { width: min(520px, 92vw); background: var(--panel); border: 1px solid var(--border);
                  border-radius: 12px; padding: 16px 18px; box-shadow: 0 16px 48px rgba(20,19,16,.22);
                  max-height: calc(100dvh - 32px); overflow-y: auto; box-sizing: border-box; }
    .modal-card h3 { margin: 0 0 12px; font-size: 16px; color: var(--fg);
                     font-family: var(--font-sans); font-weight: 600; }
    .modal-card .home-form { border: none; padding: 0; margin-bottom: 6px; }
    .modal-card .meta.readonly { flex-basis: 100%; font-size: 12px; color: var(--dim); word-break: break-all; }
    .home-form .meta.readonly code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px;
                                     background: var(--sunken); padding: 1px 4px; border-radius: 4px; color: var(--accent); }
    .home-form .meta.readonly .hint-strong { display: block; margin-top: 4px; color: var(--warn); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    .modal-actions button.primary { color: var(--on-accent); }

    /* —— 右上角主题切换：设置按钮 + 下拉菜单（白天/黑夜/跟随系统） —— */
    .topbar-right { display: flex; align-items: center; flex-shrink: 0; margin-left: 8px; }
    .theme-wrap { position: relative; }
    .icon-btn { display: inline-flex; width: 30px; height: 30px; align-items: center; justify-content: center;
                padding: 0; font-size: 15px; line-height: 1; border: 1px solid var(--border); border-radius: 6px;
                background: var(--panel); color: var(--fg); cursor: pointer;
                transition: border-color .15s, background .15s, color .15s; }
    .icon-btn:hover { border-color: var(--accent); background: var(--hover); color: var(--accent); }
    .menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 40; min-width: 170px;
            background: var(--tooltip-bg); border: 1px solid var(--border); border-radius: 8px;
            box-shadow: 0 8px 28px rgba(20,19,16,.16); padding: 6px; }
    .menu[hidden] { display: none !important; }
    .menu-heading { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .02em;
                    font-family: var(--font-sans); font-weight: 600; padding: 4px 10px 6px; }
    .menu-item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px;
                 font: inherit; font-size: 13px; color: var(--fg); background: transparent; border: none;
                 border-radius: 6px; cursor: pointer; text-align: left; transition: background .12s, color .12s; }
    .menu-item:hover { background: var(--hover); }
    .menu-item.active { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
    .menu-item .mk { margin-left: auto; font-weight: 700; color: var(--accent); opacity: 0; }
    .menu-item.active .mk { opacity: 1; }
    /* 主题同步开关：与上面的三选一是两种语义（一组互斥选择 vs 一个布尔开关），
       用一条细分隔线分开，并让开关的选中态同样落在 .mk 对勾上。 */
    .menu-sep { height: 1px; margin: 5px 6px; background: var(--border); }
    .menu-toggle-label { flex: 1; }
    .menu-toggle[aria-checked="true"] .mk { opacity: 1; }
    .menu-toggle[aria-checked="true"] { color: var(--accent); }
  .endpoint-editor { flex-basis: 100%; border: 1px solid var(--border, #ddd); border-radius: 8px; padding: 12px; min-width: 0; }
    .endpoint-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(100px, .55fr); gap: 10px 12px; padding: 14px 0; border-bottom: 1px solid var(--border, #ddd); }
    .endpoint-row input, .endpoint-switch select { min-width: 0; max-width: 100%; }
    .config-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 200px; font-size: 12px; color: var(--fg); }
    .config-field > span { font-weight: 500; }
    .config-field small { color: var(--dim); font-weight: normal; margin-left: 4px; }
    .home-form .config-field input, .home-form .config-field select { flex: none; width: 100%; box-sizing: border-box; }
    .endpoint-token, .endpoint-row-actions { grid-column: 1 / -1; }
    .endpoint-row-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .endpoint-editor > .meta { margin: 4px 0 0; line-height: 1.6; }
    .endpoint-editor > button { margin-top: 12px; }
    .endpoint-switch { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; width: 100%; }
    .endpoint-switch .config-field { flex: 1; }
    .endpoint-switch select { width: 100%; box-sizing: border-box; font: inherit; }
    </style>
  <link rel="stylesheet" href="/file-preview.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">(=hωb=) <span id="live" class="live">connecting…</span></div>
    <div id="tabs" class="tabbar"></div>
    <div class="topbar-right">
      <div id="preview-actions"></div>
      <div class="theme-wrap">
        <button id="theme-btn" class="icon-btn" title="选择界面外观" aria-haspopup="true"
                aria-label="切换主题（白天/黑夜/跟随系统）">🌓</button>
        <div id="theme-menu" class="menu" hidden>
          <div class="menu-heading">界面外观</div>
          <button class="menu-item" data-mode="light" role="menuitem"><span>☀️</span>白天<span class="mk">✓</span></button>
          <button class="menu-item" data-mode="dark" role="menuitem"><span>🌙</span>黑夜<span class="mk">✓</span></button>
          <button class="menu-item" data-mode="system" role="menuitem"><span>💻</span>跟随系统<span class="mk">✓</span></button>
          <!-- 主题同步开关：hwb 是权威、dsh 跟随（单向下发）。默认开启 ——
               「hwb 与 dsh 外观一致」是这个功能的全部意义，要求用户先找到开关才生效不合理。 -->
          <div class="menu-sep" role="separator"></div>
          <button id="theme-sync" class="menu-item menu-toggle" role="menuitemcheckbox" aria-checked="true"
                  title="切换主题时同步给已连接的 dsh 实例（写入其 settings.yaml）">
            <span>🔄</span><span class="menu-toggle-label">同步到 dsh 实例</span><span class="mk">✓</span>
          </button>
        </div>
      </div>
    </div>
  </header>
  <main id="main">
    <!-- 刷新/连接失败提示：挂在 dashboard 之外，dashboard 每轮 SSE 刷新都会重建 innerHTML -->
    <div id="note" class="note" role="status" aria-live="polite" hidden></div>
    <div id="dashboard" class="view" data-layout="grid"><div class="empty">loading…</div></div>
  </main>
  <div id="modal" class="modal" hidden></div>
  <!-- 首帧前应用已保存的主题，避免刷新闪一下（亮→暗切换） -->
  <script>
    (function () {
      try {
        var m = localStorage.getItem('hwb:theme');
        document.documentElement.setAttribute('data-theme', (m === 'light' || m === 'dark') ? m : 'system');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'system'); }
    })();
  </script>
  <script type="module" src="/app.js"></script>
</body>
</html>
