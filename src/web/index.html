<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hwb — harness workbench</title>
  <!-- 网页标题图标：优先 SVG（现代浏览器清晰/可缩放），PNG/ICO 作回退，另配 apple-touch -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      /* DeepSeek 官方蓝 #4D6BFE 为骨架，配深海军蓝中性色 */
      --bg: #0e1018; --panel: #171b29; --panel-2: #1e2336; --border: #272d3f;
      --fg: #dbe1f0; --dim: #8a92a8; --accent: #4d6bfe; --accent-2: #4166d5;
      --accent-soft: rgba(77, 107, 254, .14); --hover: #20263a;
      --ok: #3fcb8a; --warn: #e9a83c; --bad: #eb5b5b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); display: flex; flex-direction: column;
           min-height: 100vh; font: 14px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; }

    /* 顶部 bar：品牌 + 实例 tab 卡（可拖动排序） */
    #topbar { display: flex; align-items: center; gap: 16px; padding: 0 14px; height: 46px;
              border-bottom: 1px solid var(--border); background: var(--panel);
              flex-shrink: 0; position: sticky; top: 0; z-index: 10; }
    #topbar .brand { font-size: 16px; font-weight: 700; display: flex; gap: 10px; align-items: baseline;
                     flex-shrink: 0; font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; }
    #topbar .brand .live { font-size: 12px; font-weight: 400; color: var(--dim); }
    #topbar .brand .live.on { color: var(--ok); }
    /* 选项卡：独立「胶囊」造型，边框+底色双重区分，选中态铺 DeepSeek 蓝并加投影，辨识度更高 */
    .tabbar { display: flex; align-items: center; gap: 6px; overflow-x: auto; min-width: 0; flex: 1; }
    .tab { display: flex; align-items: center; gap: 8px; padding: 6px 12px; height: auto;
           border: 1px solid transparent; border-radius: 8px; background: transparent;
           color: var(--dim); font: inherit; font-size: 13px; line-height: 1;
           cursor: pointer; white-space: nowrap; flex-shrink: 0;
           transition: color .16s, background .16s, border-color .16s, box-shadow .16s; }
    .tab:hover { color: var(--fg); background: var(--accent-soft); border-color: rgba(77,107,254,.35); }
    .tab.active { color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2));
                  border-color: var(--accent); box-shadow: 0 3px 12px rgba(77,107,254,.32); }
    .tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex-shrink: 0; }
    .tab .dot.running { background: var(--ok); box-shadow: 0 0 0 2px rgba(63,203,138,.25); }
    .tab .dot.unreachable { background: var(--warn); }
    .tab .dot.gone { background: var(--bad); }
    .tab .label { overflow: hidden; text-overflow: ellipsis; }
    .tab[draggable=true] { cursor: grab; }
    .tab.dragging { opacity: .4; }
    .tab.drag-target { box-shadow: 0 0 0 2px var(--accent); }

    #main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column;
            overflow: hidden; }
    /* 视图面板：工作台 / 每个实例一个持久 iframe。切换只 show/hide，不销毁重建。 */
    .view { flex: 1; min-height: 0; }
    .view[hidden] { display: none !important; }
    #dashboard[data-layout=grid] { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 14px;
                                   padding: 14px 20px; align-content: start; overflow-y: auto; }
    #dashboard[data-layout=onboarding] { padding: 24px 28px; overflow-y: auto; }

    section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    section > h2 { margin: 0; padding: 10px 14px; font-size: 13px; color: var(--dim);
                   border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: .04em; }
    .rows { padding: 6px; }
    /* 顶栏三张列表卡：内容超过可视高度时，列表自身滚动（不撑长整页） */
    #dashboard[data-layout=grid] > section:nth-child(-n+3) > .rows {
      max-height: calc(100vh - 160px);
      overflow-y: auto;
    }
    #dashboard[data-layout=grid] .rows::-webkit-scrollbar { width: 8px; }
    #dashboard[data-layout=grid] .rows::-webkit-scrollbar-thumb { background: #333d5c; border-radius: 4px; }
    #dashboard[data-layout=grid] .rows::-webkit-scrollbar-track { background: transparent; }
    .row { padding: 8px 10px; border-radius: 6px; }
    .row:hover { background: var(--hover); }
    .row.clickable { cursor: pointer; }
    /* 联动高亮：悬停 Projects ↔ Sessions 相互高亮 */
    .row.hl-project { background: #243054; box-shadow: inset 2px 0 0 var(--accent); }
    .chip.home-chip { background: #1c2b4a; color: #8fb7ff; }
    .chip.proj-chip { background: #3a2f1c; color: #e6b45c; }
    .row .t { display: flex; justify-content: space-between; gap: 8px; }
    .row .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .meta { color: var(--dim); font-size: 12px; margin-top: 2px;
                 display: flex; gap: 10px; flex-wrap: wrap; }
    .chip { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px;
            background: var(--panel-2); color: var(--accent); }
    .chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); }
    /* 会话状态 chip：彩色圆点 + 文本。run=运行中(green)，done=已完成(accent)，idle=空闲(dim) */
    .chip.status { display: inline-flex; align-items: center; gap: 4px; padding-right: 9px; }
    .chip.status::before { content: ''; width: 6px; height: 6px; border-radius: 50%;
                           background: currentColor; flex: none; }
    .chip.status.run { color: var(--ok); }
    .chip.status.done { color: var(--accent); }
    .chip.status.idle { color: var(--dim); }
    .pressure { height: 4px; border-radius: 2px; background: var(--panel-2); margin-top: 6px; overflow: hidden; }
    .pressure > i { display: block; height: 100%; background: var(--accent); }
    .empty { color: var(--dim); padding: 14px; font-size: 13px; }
    button { font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 6px; cursor: pointer;
             background: var(--panel-2); color: var(--fg); border: 1px solid var(--border); }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    button.danger:hover { border-color: var(--bad); color: var(--bad); }
    button:disabled { opacity: .5; cursor: default; }
    section > h2 button.add { float: right; text-transform: none; letter-spacing: 0; }
    .meta.actions button { padding: 0 8px; font-size: 11px; }
    .degraded-detail { color: var(--warn); word-break: break-all; }
    .home-form { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 14px;
                 border-bottom: 1px solid var(--border); }
    .home-form input, .home-form select { flex: 1 1 160px; font: inherit; font-size: 12px; padding: 5px 8px;
                                          background: #0c0f17; color: var(--fg); border: 1px solid var(--border); border-radius: 6px; }
    .home-form input:focus, .home-form select:focus { outline: none; border-color: var(--accent); }
    .home-form .home-mode { flex: 0 0 auto; }
    .home-form .form-msg { flex-basis: 100%; font-size: 12px; color: var(--warn); }
    .home-form .form-msg.error { color: var(--bad); }
    .onboarding { grid-column: 1 / -1; padding: 24px 28px; max-width: 720px; }
    .onboarding h2 { margin: 0 0 10px; font-size: 18px; border: none; padding: 0;
                     color: var(--fg); text-transform: none; letter-spacing: 0; }
    .onboarding p { color: var(--dim); margin: 8px 0; }
    .onboarding .hint { font-size: 12px; }
    .onboarding .home-form { padding: 12px 0 0; border: none; }
    .usage { grid-column: 1 / -1; }
    .usage-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr 1fr; gap: 8px; padding: 10px 14px; }
    .usage-big, .usage-stat { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
    .usage-big .num { display: block; font-size: 20px; font-weight: 700; color: var(--fg); }
    .usage-big .cap, .usage-stat .c { font-size: 11px; color: var(--dim); }
    .usage-stat .n { display: block; font-size: 15px; font-weight: 600; color: var(--accent); }
    /* 单条构成线：输入/缓存/输出按占比分段，不同颜色，悬停显示用量与占比 */
    .usage-stream { display: flex; height: 16px; margin: 4px 14px 2px; border-radius: 8px; overflow: hidden;
                    background: #0c0f17; box-shadow: inset 0 0 0 1px var(--border); }
    .usage-stream .seg { height: 100%; min-width: 6px; cursor: pointer; transition: filter .12s, opacity .12s; }
    .usage-stream .seg:hover { filter: brightness(1.3); }
    .usage-stream .seg.s-in { background: var(--accent); }
    .usage-stream .seg.s-out { background: #7bd88f; }
    .usage-stream .seg.s-hit { background: #5fd0d0; }
    .usage-stream .seg.s-write { background: #e0a13c; }
    .usage-stream-cap { margin: 0 14px 6px; font-size: 11px; color: var(--dim); }
    /* 悬停 tooltip：fixed 定位到 body，绝不溢出/被裁剪 */
    .usage-stream-tip { position: fixed; z-index: 100; max-width: 280px; padding: 5px 9px; border-radius: 6px;
                        background: rgba(8,10,16,.96); border: 1px solid var(--border); color: var(--fg);
                        font-size: 12px; line-height: 1.4; pointer-events: none; display: flex; gap: 12px; align-items: baseline;
                        box-shadow: 0 8px 24px rgba(0,0,0,.4); white-space: nowrap; }
    .usage-stream-tip[hidden] { display: none !important; }
    .usage-stream-tip b { color: var(--fg); font-weight: 600; }
    .usage-stream-tip .t { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600; }
    .usage-stream-tip .p { color: var(--dim); }
    .usage-trend-block { padding: 6px 14px 10px; border-top: 1px solid var(--border); }
    .usage-trend-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .usage-trend-title { font-size: 12px; color: var(--dim); flex-shrink: 0; }
    .trend-toggle { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; }
    /* 维度切换：占满中间、横向滚动而非换行；范围说明固定右侧，避免被挤压/遮挡 */
    .trend-toggle.trend-dim { flex: 1 1 auto; min-width: 0; overflow-x: auto; padding-bottom: 2px; }
    .trend-toggle .usage-dim-btn { padding: 2px 9px; font-size: 11px; flex-shrink: 0; }
    .trend-toggle .usage-dim-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .trend-range { flex-shrink: 0; font-size: 11px; color: var(--dim); white-space: nowrap; }
    .trend-toggle .usage-dim-btn, .trend-toggle .usage-period-btn { background: transparent; border: 1px solid var(--border); border-radius: 4px; color: var(--dim); cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
    .trend-toggle .usage-dim-btn:hover, .trend-toggle .usage-period-btn:hover { border-color: var(--accent); color: var(--fg); }
    .trend-toggle .usage-period-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    /* 周期切换：单行不换行，过宽横向滚动，避免遮挡/折行 */
    .usage-period-toggle { margin-top: 2px; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .usage-period-toggle .usage-period-btn { flex-shrink: 0; }
    /* 点图：左 Y 轴 + 主绘图区（水平网格线/平滑拟合曲线/数据点）+ 底部 X 轴 */
    .trend-chart { display: flex; gap: 6px; width: 100%; }
    .trend-y { position: relative; flex: 0 0 52px; height: 130px; }
    .trend-ytick { position: absolute; right: 2px; transform: translateY(50%); font-size: 10px; color: var(--dim); font-variant-numeric: tabular-nums; }
    .trend-main { flex: 1; min-width: 0; }
    .trend-plot { position: relative; height: 130px; }
    .trend-gridline { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--border); }
    .trend-line { position: absolute; inset: 0; width: 100%; height: 100%; }
    .trend-dot { position: absolute; width: 8px; height: 8px; border-radius: 50%; transform: translate(-50%, 50%);
                 border: 1px solid rgba(15,17,23,.85); box-shadow: 0 0 0 1px rgba(15,17,23,.3); cursor: pointer; transition: transform .12s; }
    .trend-dot:hover { transform: translate(-50%, 50%) scale(1.5); }
    .trend-x { display: flex; gap: 2px; margin-top: 2px; }
    .trend-xcell { flex: 1; text-align: center; font-size: 10px; color: var(--dim); overflow: hidden; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .trend-caption { margin-top: 6px; font-size: 11px; color: var(--dim); }
    .trend-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; }
    .trend-legend-item { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--dim); }
    .trend-legend-item i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
    .usage-projects { padding: 2px 14px 10px; }
    .usage-projects .up-row { justify-content: space-between; }
    .usage-grid + .meta { padding-left: 14px; }

    /* 运行日志面板（grid 内跨整行） */
    .logs { grid-column: 1 / -1; }
    .logs > h2 { display: flex; align-items: center; gap: 8px; }
    .logs .log-live { margin-left: auto; font-size: 11px; font-weight: 400; color: var(--dim);
                      display: inline-flex; align-items: center; gap: 5px; }
    .logs .log-live i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok);
                        animation: logpulse 2s infinite; }
    @keyframes logpulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    .logs .log-tools { display: flex; gap: 4px; }
    .log-fbtn { padding: 1px 8px; font-size: 11px; border-radius: 4px; background: transparent;
                border: 1px solid var(--border); color: var(--dim); cursor: pointer; }
    .log-fbtn:hover { border-color: var(--accent); color: var(--fg); }
    .log-fbtn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .log-body { max-height: 520px; overflow-y: auto; padding: 6px 10px; font-size: 12px; line-height: 1.45;
                font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .log-body::-webkit-scrollbar { width: 8px; }
    .log-body::-webkit-scrollbar-thumb { background: #333d5c; border-radius: 4px; }
    .log-body::-webkit-scrollbar-track { background: transparent; }
    .log-row { padding: 2px 4px; border-bottom: 1px solid var(--border); white-space: pre-wrap;
               word-break: break-all; cursor: default; }
    .log-row:hover { background: var(--hover); }
    .log-row .log-ts { color: var(--dim); margin-right: 8px; }
    .log-row .log-lvl { display: inline-block; width: 46px; font-weight: 600; }
    .log-row.debug .log-lvl { color: var(--dim); }
    .log-row.info .log-lvl { color: var(--accent); }
    .log-row.warn .log-lvl { color: var(--warn); }
    .log-row.error .log-lvl { color: var(--bad); }
    .log-row .log-scope { color: #7fd0c0; margin-right: 8px; }
    .log-row.warn .log-msg { color: #f0c07a; }
    .log-row.error .log-msg { color: #ffb0ac; }
    .log-row .log-fields { color: var(--dim); }
    .log-stack { margin: 4px 0 0 54px; padding: 6px 8px; background: #0c0f17; border: 1px solid var(--border);
                 border-radius: 4px; color: #b8bfd0; font-family: inherit; font-size: 11px;
                 overflow-x: auto; white-space: pre; }

    /* 实例视图：全高 iframe（去掉顶部条，切回工作台走顶部 tab）。右上角浮层仅悬停可见。 */
    .iframe-pane { position: relative; display: flex; flex-direction: column; overflow: hidden; }
    .iframe-pane iframe { flex: 1; width: 100%; border: none; background: #fff; }
    .frame-loading { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--dim); }
    /* 加载遮罩：盖住 iframe, 把 dsh web 每次全量重载时的白闪遮成面板色加载态 */
    .frame-cover { position: absolute; inset: 0; z-index: 4; display: flex; align-items: center;
                   justify-content: center; background: var(--bg); color: var(--dim); font-size: 14px; }
    .frame-cover[hidden] { display: none !important; }
    .float-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; z-index: 5;
                     opacity: 0; transition: opacity .15s; }
    .iframe-pane:hover .float-actions { opacity: 1; }

    @media (max-width: 1100px) { #dashboard[data-layout=grid] { grid-template-columns: 1fr; } }

    /* 实例设置弹层 */
    .modal { position: fixed; inset: 0; background: rgba(4,6,10,.66); display: flex;
             align-items: center; justify-content: center; z-index: 50; }
    .modal[hidden] { display: none !important; }
    .modal-card { width: min(520px, 92vw); background: var(--panel); border: 1px solid var(--border);
                  border-radius: 10px; padding: 16px 18px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
    .modal-card h3 { margin: 0 0 12px; font-size: 15px; color: var(--fg); }
    .modal-card .home-form { border: none; padding: 0; margin-bottom: 6px; }
    .modal-card .meta.readonly { flex-basis: 100%; font-size: 12px; color: var(--dim); word-break: break-all; }
    .home-form .meta.readonly code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px;
                                     background: #0c0f17; padding: 1px 4px; border-radius: 4px; color: var(--accent); }
    .home-form .meta.readonly .hint-strong { display: block; margin-top: 4px; color: var(--warn); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    .modal-actions button.primary { color: #fff; }
  </style>
</head>
<body>
  <header id="topbar">
    <div class="brand">(=hωb=) <span id="live" class="live">connecting…</span></div>
    <div id="tabs" class="tabbar"></div>
  </header>
  <main id="main">
    <div id="dashboard" class="view" data-layout="grid"><div class="empty">loading…</div></div>
  </main>
  <div id="modal" class="modal" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
