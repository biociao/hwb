# dsh-http-cache.nginx.conf — 用 nginx 给 dsh web 加 HTTP 本地缓存(替选方案)
#
# 作用和 Caddyfile 版一致: 在 dsh web(:3080)前加缓存头 + 压缩, 解决前端
# 静态资源被浏览器反复重新下载导致的"打开页面/实例慢"。
#
# 部署 (远程服务器, 已装 nginx):
#   1) 把 server 块放进 /etc/nginx/conf.d/dsh-http-cache.conf
#   2) 注意: 这里 proxy_pass 指向 127.0.0.1:3080 (dsh web 不动);
#      本 server 监听 3081, 浏览器改访问 http://<服务器IP>:3081
#   3) nginx -t && systemctl enable --now nginx && systemctl reload nginx
#   4) 若 3081 已占用或想用 80: 改 listen 那行; 想配 https(80->443) 加 ssl 指令。

# 5) 本文件同时包含 http 级指令(map)，所以**不能**直接塞进 /etc/nginx/conf.d/
#    如果只想放一个文件: 把 map 块一起放进 conf.d 是允许的(conf.d/*.conf 在 http 上下文
#    里被 include)，但若你的 nginx.conf 把 conf.d 放在 http{} 之外就会报错，
#    这时把 map 移到 nginx.conf 的 http{} 里即可。

# WebSocket 升级头：Connection 必须**按请求**决定。
# 常见错法是在 location / 里无条件 `proxy_set_header Connection "upgrade"` —— 那会让
# 每一个普通 HTTP 请求（页面、JSON、SSE）都带着 `Connection: upgrade` 发给上游，
# 既不符合 HTTP 语义，也会让 nginx 无法对上游做 keep-alive（每个请求新建一条连接）。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3081;
    server_name _;

    # gzip 压缩静态文本(js/css/svg/json), 大幅降低传输量
    gzip on;
    gzip_types text/javascript text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;
    gzip_vary on;

    # 已 hash 的静态资源 -> 强缓存 1 年(immutable, 不重新校验)
    location /assets/ {
        proxy_pass http://127.0.0.1:3080;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }

    # 静态入口(小文件)不缓存, 走校验避免旧注入残留
    location = /index.html { add_header Cache-Control "no-cache"; proxy_pass http://127.0.0.1:3080; }
    location = /favicon.svg { add_header Cache-Control "no-cache"; proxy_pass http://127.0.0.1:3080; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; proxy_pass http://127.0.0.1:3080; }

    # 其余所有请求透传; WebSocket(/api/events.mux /api/events.host)需要 upgrade 头。
    # 注意这里的 Connection 走 map: 只有真的带 Upgrade 的请求才回 upgrade, 其余回 close
    # (HTTP/1.1 下 nginx 会按上游 keep-alive 设置决定复用与否, 不会把 upgrade 强加给普通请求)。
    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_pass http://127.0.0.1:3080;
    }
}
